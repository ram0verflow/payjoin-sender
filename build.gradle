plugins {
    id 'java'
}

group = 'org.payjoin'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

def payjoinOracle = file(findProperty('payjoinOracle') ?: "${rootDir}/../rust-payjoin")
def oracleClasses = new File(payjoinOracle, 'payjoin-ffi/kotlin/build/classes/kotlin/main')
def oracleNative = new File(payjoinOracle, 'target/debug/libpayjoin_ffi.dylib')

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'com.code-intelligence:jazzer-junit:0.30.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (oracleClasses.isDirectory() && oracleNative.isFile()) {
        testImplementation files(oracleClasses)
        testImplementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'
        testImplementation 'net.java.dev.jna:jna:5.17.0'
        testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    }
}

def configurePayjoinFfi = { task ->
    if (oracleNative.isFile()) {
        task.jvmArgs '--enable-native-access=ALL-UNNAMED'
        task.systemProperty 'payjoin.oracle.native', oracleNative.absolutePath
        task.systemProperty 'uniffi.component.payjoin.libraryOverride', oracleNative.absolutePath
        task.systemProperty 'jna.library.path', oracleNative.parent
    }
}

test {
    useJUnitPlatform {
        excludeTags 'oracle', 'fuzz'
    }
    filter {
        excludeTestsMatching '*FuzzTest*'
    }
    configurePayjoinFfi(it)
}

tasks.register('fuzz', Test) {
    group = 'verification'
    description = 'Coverage-guided Jazzer runs. Not part of the test task.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'fuzz'
    }
    forkEvery = 1
    maxParallelForks = 1
    environment 'JAZZER_FUZZ', '1'
    systemProperty 'jazzer.fuzz', '1'
    systemProperty 'jazzer.instrument', 'org.payjoin.sender.**'
    outputs.upToDateWhen { false }
}

tasks.register('oracleTest', Test) {
    group = 'verification'
    description = 'Cross-checks that need a Rust toolchain. Not part of the default test task.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'oracle'
    }
    configurePayjoinFfi(it)
}
